<svg xmlns="http://www.w3.org/2000/svg" width="2232" height="784" viewBox="0 0 2232 784" role="img" aria-label="The operator, running the AWS CLI and the public calif.io proof of concept, reaches the lab only through AWS SSM - Session Manager, Run Command and Inventory - because the nodes have no inbound network path. SSM drives five nodes in private subnets. Three are EXPOSED: vuln-jdk21, vuln-jdk17 and vuln-jdk25, all c7i x86 instances running the same vulnerable AVX-512 VBMI intrinsic on three different affected Java trains (Corretto 21.0.13, 17.0.13 and 25.0.5). Two are immune even though they run the same vulnerable Java: safe-arm, a t4g Graviton ARM64 instance, and safe-intel, a t3 x86 instance - neither has AVX-512 VBMI, so the bug cannot fire. There is no pre-patched node; patch.sh flips a vulnerable node live. The nodes egress through a NAT gateway to pull pinned JDK tarballs from the Amazon Corretto archive, and each publishes its verdict to SSM Inventory."><defs><marker id="a_e_in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_v25" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_v21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_v17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_intel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_dl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5bb"/></marker></defs><rect width="2232" height="784" fill="#0d1117"/><path d="M1116.0,144 V235" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_in)"/><text x="1130.0" y="198.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">SSM only</text><path d="M1116.0,344 V435" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_v25)"/><text x="1130.0" y="398.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">exec . verdict</text><path d="M1116.0,344 L236.0,435" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_v21)"/><path d="M1116.0,344 L676.0,435" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_v17)"/><path d="M1116.0,344 L1556.0,435" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_arm)"/><path d="M1116.0,344 L1996.0,435" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_intel)"/><path d="M1116.0,544 V635" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_eg)"/><text x="1130.0" y="598.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">egress</text><path d="M1308,692.0 H1799" fill="none" stroke="#39c5bb" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a_e_dl)"/><text x="1556.0" y="680.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#39c5bb" stroke="#0d1117" stroke-width="6" paint-order="stroke">JDK pull</text><rect x="924" y="40" width="384" height="104" rx="10" ry="10" fill="#161b22" stroke="#c8d6e8" stroke-width="2"/><g transform="translate(944,77.0) scale(1.25)" fill="none" stroke="#c8d6e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="988.0" y="88.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Operator + PoC</text><text x="988.0" y="114.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">AWS CLI, and your calif.io PoC</text><rect x="924" y="240" width="384" height="104" rx="10" ry="10" fill="#161b22" stroke="#c39be8" stroke-width="2"/><g transform="translate(944,277.0) scale(1.25)" fill="none" stroke="#c39be8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></g><text x="988.0" y="288.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">AWS SSM</text><text x="988.0" y="314.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Session Manager / Run Command / Inventory</text><rect x="44" y="440" width="384" height="104" rx="10" ry="10" fill="#161b22" stroke="#ff6b66" stroke-width="2"/><g transform="translate(64,477.0) scale(1.25)" fill="none" stroke="#ff6b66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></g><text x="108.0" y="488.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">vuln-jdk21</text><text x="108.0" y="514.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">c7i x86 . 21.0.13 . EXPOSED</text><rect x="484" y="440" width="384" height="104" rx="10" ry="10" fill="#161b22" stroke="#ff6b66" stroke-width="2"/><g transform="translate(504,477.0) scale(1.25)" fill="none" stroke="#ff6b66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></g><text x="548.0" y="488.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">vuln-jdk17</text><text x="548.0" y="514.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">c7i x86 . 17.0.13 . EXPOSED</text><rect x="924" y="440" width="384" height="104" rx="10" ry="10" fill="#161b22" stroke="#ff6b66" stroke-width="2"/><g transform="translate(944,477.0) scale(1.25)" fill="none" stroke="#ff6b66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></g><text x="988.0" y="488.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">vuln-jdk25</text><text x="988.0" y="514.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">c7i x86 . 25.0.5 . EXPOSED</text><rect x="1364" y="440" width="384" height="104" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/><g transform="translate(1384,477.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></g><text x="1428.0" y="488.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">safe-arm</text><text x="1428.0" y="514.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">t4g ARM64 . no VBMI . safe</text><rect x="1804" y="440" width="384" height="104" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/><g transform="translate(1824,477.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></g><text x="1868.0" y="488.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">safe-intel</text><text x="1868.0" y="514.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-